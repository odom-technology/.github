name: Bug report
description: Report a reproducible problem in an ODOM Tech project.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Remove secrets, private identifiers, customer data, and personal information before submitting.
  - type: input
    id: version
    attributes:
      label: Version or revision
      description: Which release, commit, service version, or browser build is affected?
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest sanitized sequence that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Relevant platform, runtime, browser, or deployment details without unique identifiers.
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      render: shell
